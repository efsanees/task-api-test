name: DevSecOps Code Review (Reusable)

# Bu workflow diğer repolardan çağrılabilir:
#
#   jobs:
#     security:
#       uses: efsanees/task-api-test/.github/workflows/pr-review-reusable.yml@main
#       secrets:
#         GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

on:
  workflow_call:
    secrets:
      GROQ_API_KEY:
        description: "Groq API key — AI fix önerileri ve FP filtresi için"
        required: false

jobs:
  security-gate:
    name: Security Gate (SAST + SCA)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write

    steps:
      - name: Checkout (çağıran repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DevSecOps script'i indir (task-api-test'ten)
        run: |
          curl -sSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/efsanees/task-api-test/contents/scripts/github_pr_review.py" \
            -o github_pr_review.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install bandit groq requests

      - name: DevSecOps Security Gate çalıştır
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}
          REPO:         ${{ github.repository }}
          HEAD_SHA:     ${{ github.event.pull_request.head.sha }}
          BASE_SHA:     ${{ github.event.pull_request.base.sha }}
        run: python github_pr_review.py
